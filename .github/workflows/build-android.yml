name: Build ST Stock Opname APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Uji otomatis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Periksa sintaks Python
        run: python -m py_compile mobile/main.py mobile/repository.py mobile/api_repository.py

      - name: Jalankan unit test
        run: python -m unittest discover -s tests -v

  build:
    name: Bangun APK Android
    needs: test
    # Build APK hanya saat tombol Run workflow ditekan atau tag v* dibuat.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python untuk Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang dependensi sistem
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake \
            libltdl-dev

      - name: Pulihkan cache SDK, NDK, dan hasil kompilasi
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: st-stock-p4a-2024.01.21-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            st-stock-p4a-2024.01.21-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}-
            st-stock-p4a-2024.01.21-${{ runner.os }}-

      - name: Pasang Buildozer dan Cython yang kompatibel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer "cython==0.29.34" setuptools virtualenv
          buildozer --version
          cython --version
          java -version

      - name: Verifikasi konfigurasi toolchain yang dikunci
        run: |
          set -euo pipefail
          python - <<'PY'
          from configparser import ConfigParser
          config = ConfigParser()
          if not config.read('mobile/buildozer.spec'):
              raise SystemExit('mobile/buildozer.spec tidak ditemukan')
          checks = {
              'requirements': 'python3,kivy==2.3.0',
              'android.api': '33',
              'android.minapi': '24',
              'android.ndk': '25b',
              'p4a.branch': 'v2024.01.21',
          }
          for key, expected in checks.items():
              actual = config.get('app', key).replace(' ', '')
              if actual != expected:
                  raise SystemExit(f'{key}: diharapkan {expected!r}, ditemukan {actual!r}')
              print(f'OK {key} = {actual}')
          if not config.getboolean('app', 'android.accept_sdk_license'):
              raise SystemExit('android.accept_sdk_license harus True')
          print('OK android.accept_sdk_license = True')
          PY

      - name: Bangun APK debug
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          buildozer -v android debug 2>&1 | tee ../build.log

      - name: Verifikasi hasil APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(mobile/bin/*.apk)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo 'ERROR: Buildozer tidak menghasilkan file APK di mobile/bin/'
            exit 1
          fi
          echo 'APK yang berhasil dibuat:'
          ls -lh "${APK_FILES[@]}"
          mkdir -p dist
          for apk in "${APK_FILES[@]}"; do
            cp "$apk" "dist/ST-Stock-Opname-${GITHUB_RUN_NUMBER}.apk"
          done

      - name: Simpan cache termasuk bila build gagal
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: st-stock-p4a-2024.01.21-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}-${{ github.run_id }}

      - name: Ringkasan petunjuk bila build gagal
        if: failure()
        shell: bash
        run: |
          {
            echo '## ST Stock Opname — Build gagal'
            echo
            echo '### Baris error penting'
            echo '```text'
            if [ -f build.log ]; then
              grep -n -i -E 'error:|fatal error|Traceback|Command failed|No space left|No matching distribution|failed with exit code' build.log \
                | tail -n 50 | cut -c1-240 || true
              echo
              echo '### 80 baris terakhir log build'
              tail -n 80 build.log | cut -c1-240
            else
              echo 'build.log belum dibuat; periksa langkah sebelum Buildozer.'
            fi
            echo '```'
            echo
            echo '### Ruang disk runner'
            echo '```text'
            df -h / | tail -n 2
            echo '```'
            echo 'Log lengkap tersedia pada artifact ST-Stock-Opname-Build-Log.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah log lengkap untuk diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ST-Stock-Opname-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Unggah APK sebagai artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ST-Stock-Opname-Android-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
