name: Build ST Stock Opname APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (debug)
    # Pin the runner to Ubuntu 22.04. Do not use the third-party
    # Buildozer Docker action here: its Docker image currently tries to
    # install Java from an OpenJDK PPA that has no 'resolute' Release file.
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: mobile/requirements-dev.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git zip unzip \
            autoconf automake libtool libltdl-dev \
            pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<81" "Cython==0.29.34" buildozer
          buildozer --version
          java -version

      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-jammy-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-jammy-

      - name: Build APK
        working-directory: mobile
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ST-Stock-Opname-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
          retention-days: 14
